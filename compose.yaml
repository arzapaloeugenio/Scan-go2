# Scan & Go 2 - orquestación local con Docker Compose.
#
# La contraseña de PostgreSQL se toma de .env.docker (ver .env.docker.example).
# No se escriben secretos reales en este archivo.
#
# Uso:
#   cp .env.docker.example .env.docker
#   docker compose --env-file .env.docker up --build -d

name: scan-go2

services:
  db:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: tottus_scan_go
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los scripts de /docker-entrypoint-initdb.d solo se ejecutan cuando
      # PostgreSQL inicializa un directorio de datos vacío (volumen nuevo).
      - ./database/init/01-create-tables.sql:/docker-entrypoint-initdb.d/01-create-tables.sql:ro
      - ./database/init/02-insert-data.sql:/docker-entrypoint-initdb.d/02-insert-data.sql:ro
      - ./database/migrations/001-google-auth-clientes.sql:/docker-entrypoint-initdb.d/03-google-auth-clientes.sql:ro
      - ./database/migrations/002-add-password-hash-clientes.sql:/docker-entrypoint-initdb.d/04-add-password-hash-clientes.sql:ro
    healthcheck:
      # -h 127.0.0.1 evita dar por sano el servidor temporal que PostgreSQL
      # usa durante la inicialización (escucha solo por socket Unix).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d tottus_scan_go"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - scan-go2

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tottus_scan_go
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.docker}
      FRONTEND_URL_LOCAL: http://localhost:8000
      # Opcional: client ID público de Google OAuth (no es un secreto).
      # Si queda vacío, la ruta de Google responde con error controlado.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - scan-go2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - scan-go2

volumes:
  pgdata:
    name: scan_go2_pgdata

networks:
  scan-go2:
    driver: bridge
