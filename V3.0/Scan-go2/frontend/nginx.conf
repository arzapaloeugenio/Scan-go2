# Scan & Go 2 - configuración del servidor estático.
# Se copia a /etc/nginx/conf.d/default.conf (incluido desde el nginx.conf
# principal de la imagen oficial).

server {
    listen 80;
    server_name _;

    # No revelar la versión detallada de Nginx en respuestas ni páginas de error.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Encabezados de seguridad. "always" los aplica también a respuestas de error.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Permite el uso de la cámara al propio origen (lector de códigos).
    add_header Permissions-Policy "camera=(self)" always;

    # CSP en modo Report-Only: NO bloquea, solo reporta. Inventario actual:
    # - Font Awesome: CSS, webfonts y fetch del service worker desde cdnjs.cloudflare.com.
    # - Quagga2 y QRCode: scripts desde cdn.jsdelivr.net.
    # - Backend local (host actual en :3000), loopback y despliegue Render.
    # - Estilos inline: un atributo style= en index.html (#reader).
    # - Cámara: getUserMedia no se controla por CSP; se permite con Permissions-Policy.
    # - worker-src/blob: el lector Quagga2 puede crear workers desde Blob.
    # Sin report-uri: no existe endpoint de reportes en el proyecto.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 https://scan-go2-backend.onrender.com https://cdnjs.cloudflare.com; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'" always;

    # Catalogo y descuentos: microservicio de solo lectura.
    # proxy_pass sin URI conserva el prefijo /api/ completo.
    # Reglas especificas antes de /api/ para no desviar login, clientes,
    # ordenes, historial ni carrito.
    location = /api/products {
        proxy_pass http://product-service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/products/ {
        proxy_pass http://product-service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/productos {
        proxy_pass http://product-service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/productos/ {
        proxy_pass http://product-service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/descuentos {
        proxy_pass http://product-service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/descuentos/ {
        proxy_pass http://product-service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ordenes, historial y carrito persistido: microservicio de ordenes.
    # Solo estas rutas reales se desvían del backend; el prefijo /api/ se
    # conserva porque proxy_pass no incluye URI.
    location = /api/ordenes {
        proxy_pass http://order-service:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ordenes/ {
        proxy_pass http://order-service:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/historial {
        proxy_pass http://order-service:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/historial/ {
        proxy_pass http://order-service:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/carrito {
        proxy_pass http://order-service:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/carrito/ {
        proxy_pass http://order-service:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API: mismo origen para el frontend; Nginx conserva el prefijo /api/
    # y lo reenvía al backend dentro de la red de Compose.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Navegación existente: sirve archivos reales y recae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
